        rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            line-height: 1.6;
            color: #ffffff;
            background: #081b29;
            overflow-x: hidden;
        }

        /* Background Animation */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
        }

        .bg-animation::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="%23ffffff" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            0% {
                transform: translateX(0) translateY(0);
            }

            100% {
                transform: translateX(10px) translateY(10px);
            }
        }



        /* Back Button */
        .back-btn {
            background: linear-gradient(135deg, #00abf0 0%, #0088cc 100%);
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 171, 240, 0.3);
            margin-top: 100px;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 171, 240, 0.4);
            color: white;
        }

        /* Project Details Container */
        .project-details {
            padding: 50px 0;
            min-height: 100vh;
        }

        .project-header {
            margin-bottom: 3rem;
        }

        .project-title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00abf0 0%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .project-meta {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #b3b3b3;
            font-size: 1rem;
        }

        .meta-item i {
            color: #00abf0;
            font-size: 1.2rem;
        }

        .meta-item strong {
            color: #ffffff;
        }

        /* Content Sections */
        .content-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .content-section:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 171, 240, 0.3);
            transform: translateY(-5px);
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #00abf0;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            font-size: 1.5rem;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .tech-badge {
            background: rgba(0, 171, 240, 0.1);
            border: 1px solid rgba(0, 171, 240, 0.3);
            padding: 8px 20px;
            border-radius: 50px;
            color: #00abf0;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tech-badge:hover {
            background: rgba(0, 171, 240, 0.2);
            transform: translateY(-2px);
        }

        .features-list {
            list-style: none;
            padding: 0;
        }

        .features-list li {
            padding: 0.8rem 0;
            color: #ccc;
            display: flex;
            align-items: start;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .features-list li:last-child {
            border-bottom: none;
        }

        .features-list li i {
            color: #00abf0;
            margin-top: 5px;
            font-size: 1rem;
        }

        .project-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #00abf0 0%, #0088cc 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 171, 240, 0.3);
        }

        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 171, 240, 0.4);
            color: white;
        }

        .btn-outline-custom {
            border: 2px solid #00abf0;
            color: #00abf0;
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-outline-custom:hover {
            background: #00abf0;
            color: #081b29;
            transform: translateY(-3px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .project-title {
                font-size: 2rem;
            }

            .project-meta {
                flex-direction: column;
                gap: 1rem;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .back-btn {
                margin-top: 80px;
            }
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 100px 0;
            color: #00abf0;
            font-size: 1.5rem;
        }

        .error-message {
            text-align: center;
            padding: 100px 0;
            color: #ff6b6b;
            font-size: 1.2rem;
        }
    </style>
    <script src="./js/navbar.js" defer></script>

</head>

        // Get project ID from URL parameter
        function getProjectId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('project');
        }

        // Load and display project details
        function loadProjectDetails() {
            const projectId = getProjectId();
            const container = document.getElementById('project-content');

            if (!projectId || !projectsDetailedData[projectId]) {
                container.innerHTML = `
          <div class="error-message" data-aos="fade-up">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Project not found. Please return to the portfolio.</p>
            <a href="./portfolio.html#projects" class="btn-primary-custom" style="margin-top: 20px;">
              <i class="fas fa-arrow-left"></i>
              Back to Portfolio
            </a>
          </div>
        `;
                return;
            }

            const project = projectsDetailedData[projectId];

            // Dynamically update document title and meta description for search crawlers
            document.title = `${project.title} | Project Details - Ankan Chakraborty`;
            const metaDescription = document.querySelector('meta[name="description"]');
            if (metaDescription) {
                metaDescription.setAttribute("content", project.description.substring(0, 150) + "...");
            }

            // Dynamically update keywords based on project details
            const metaKeywords = document.querySelector('meta[name="keywords"]');
            if (metaKeywords && project.techStack) {
                metaKeywords.setAttribute("content", `${project.title}, ${project.techStack.join(', ')}, Ankan Chakraborty Projects`);
            }

            // Dynamically update Open Graph Meta Tags
            const ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute("content", `${project.title} | Project Details`);

            const ogDescription = document.querySelector('meta[property="og:description"]');
            if (ogDescription) ogDescription.setAttribute("content", project.description.substring(0, 150) + "...");

            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute("content", `https://www.ankanchakraborty.site/projectDetails.html?project=${projectId}`);

            // Dynamically update Twitter Card Meta Tags
            const twitterTitle = document.querySelector('meta[name="twitter:title"]');
            if (twitterTitle) twitterTitle.setAttribute("content", `${project.title} | Project Details`);

            const twitterDescription = document.querySelector('meta[name="twitter:description"]');
            if (twitterDescription) twitterDescription.setAttribute("content", project.description.substring(0, 150) + "...");

            // Dynamically set canonical link to avoid duplicate parameter pages
            let canonicalLink = document.querySelector('link[rel="canonical"]');
            if (!canonicalLink) {
                canonicalLink = document.createElement('link');
                canonicalLink.rel = 'canonical';
                document.head.appendChild(canonicalLink);
            }
            canonicalLink.href = `https://www.ankanchakraborty.site/projectDetails.html?project=${projectId}`;

            // Dynamically inject JSON-LD Schema for rich search snippet indexing
            const schemaData = {
                "@context": "https://schema.org",
                "@type": "CreativeWork",
                "name": project.title,
                "description": project.description,
                "creator": {
                    "@type": "Person",
                    "name": "Ankan Chakraborty"
                },
                "programmingLanguage": project.techStack
            };
            let scriptTag = document.getElementById("projectSchema");
            if (!scriptTag) {
                scriptTag = document.createElement("script");
                scriptTag.id = "projectSchema";
                scriptTag.type = "application/ld+json";
                document.head.appendChild(scriptTag);
            }
            scriptTag.text = JSON.stringify(schemaData);

            const techStackHTML = project.techStack.map(tech => `<span class="tech-badge">${tech}</span>`).join('');
            const featuresHTML = project.features.map(feature => `<li><i class="fas fa-check-circle"></i><span>${feature}</span></li>`).join('');
            const linksHTML = project.links.map(link => `
        <a href="${link.url}" target="_blank" class="btn-primary-custom">
          <i class="${link.icon}"></i>
          ${link.text}
        </a>
      `).join('');
            const achievementsHTML = project.achievements ? project.achievements.map(achievement => `<li><i class="fas fa-trophy"></i><span>${achievement}</span></li>`).join('') : '';

            container.innerHTML = `
        <div class="project-header" data-aos="fade-up">
          <h1 class="project-title">${project.title}</h1>
          <div class="project-meta">
            <div class="meta-item">
              <i class="fas fa-calendar-alt"></i>
              <span><strong>Duration:</strong> ${project.duration}</span>
            </div>
          </div>
        </div>

        <div class="content-section" data-aos="fade-up" data-aos-delay="100">
          <h2 class="section-title">
            <i class="fas fa-info-circle"></i>
            Overview
          </h2>
          <p style="color: #ccc; font-size: 1.1rem; line-height: 1.8;">${project.description}</p>
        </div>

        <div class="content-section" data-aos="fade-up" data-aos-delay="200">
          <h2 class="section-title">
            <i class="fas fa-code"></i>
            Tech Stack
          </h2>
          <div class="tech-stack">
            ${techStackHTML}

        </div>

        <div class="content-section" data-aos="fade-up" data-aos-delay="300">

            <i class="fas fa-list-check"></i>
            Key Features
          </h2>
          <ul class="features-list">
            ${featuresHTML}
          </ul>
        </div>

        ${achievementsHTML ? `
        <div class="content-section" data-aos="fade-up" data-aos-delay="400">
          <h2 class="section-title">
            <i class="fas fa-trophy"></i>
            Achievements
          </h2>
          <ul class="features-list">
            ${achievementsHTML}
          </ul>
        </div>
        ` : ''}

        <div class="content-section" data-aos="fade-up" data-aos-delay="500">
          <h2 class="section-title">
            <i class="fas fa-link"></i>
            Project Links
          </h2>
          <div class="project-links">
            ${linksHTML}
          </div>
        </div>
      `;

        // Load project details on page load
        document.addEventListener('DOMContentLoaded', loadProjectDetails);
    </script>
</body>

</html>
